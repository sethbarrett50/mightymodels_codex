# Project-scoped Codex configuration. Roles are auto-discovered in .codex/agents/.
[agents]
enabled = true
max_concurrent_threads_per_session = 6

# Start Codex from the repository root so the script path resolves.
[mcp_servers.mighty_mcp]
command = "sh"
args = ["./bin/mightymodels-mcp-codex"]
startup_timeout_sec = 30
