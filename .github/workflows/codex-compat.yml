name: Codex Compatibility CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-compat-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-compat:
    name: Codex compatibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install project Python
        run: uv python install 3.14

      - name: Sync locked test dependencies
        run: uv sync --locked --all-packages --group test --python 3.14

      - name: Check generated agent definitions
        run: uv run --no-sync python scripts/sync_codex_agents.py --check

      - name: Check generated native skill variants
        run: uv run --no-sync python scripts/sync_codex_skills.py --check

      - name: Verify MCP launcher syntax
        run: sh -n bin/mightymodels-mcp-codex

      - name: Run Codex compatibility tests
        run: uv run --no-sync pytest -q -o addopts='' tests/codex

      - name: Confirm test results
        if: always()
        run: |
          echo 'Codex compatibility job finished.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This tests static configuration and bridge behavior, not a live Codex host.' >> "$GITHUB_STEP_SUMMARY"
